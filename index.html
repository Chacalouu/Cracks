<style>

:root {
  --bg: #050505;
  --bg2: #0c0c0c;
  --card: #111111;
  --card2: #161616;
  --line: #222;
  --text: #f4f4f4;
  --muted: #8a8a8a;
  --dim: #5c5c5c;
  --live: #e11d2e;
  --ok: #2fbf71;
  --warn: #c9a227;
  --bad: #d14b4b;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); }
body {
  font-family: "Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  border-left: 1px solid #111;
  border-right: 1px solid #111;
}
header.appbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
  background: #000;
  flex-shrink: 0;
}
.splash {
  position: absolute; inset: 0;
  background: #000;
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  overflow: hidden;
}
.splash.through {
  background: transparent;
  pointer-events: none;
}
.splash img {
  width: 96px; height: 96px;
  border-radius: 20px;
  background: #000;
  border: 1px solid #222;
  animation: splashPulse 2.5s ease-in-out both;
  transform-origin: center center;
}
.splash.through img {
  animation: splashThrough 0.3s cubic-bezier(.2,.7,.2,1) forwards;
  border-color: transparent;
}
.splash strong {
  letter-spacing: 0.28em;
  font-size: 14px;
  color: #f4f4f4;
  animation: splashIn 0.5s ease both;
}
.splash.through strong,
.splash.hide-title strong { opacity: 0; transition: opacity .2s linear; }
@keyframes splashIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes splashPulse {
  0% { transform: scale(.82); opacity: 0; }
  18% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes splashThrough {
  0% { transform: scale(1); opacity: 1; filter: blur(0); }
  100% { transform: scale(18); opacity: 0; filter: blur(2px); }
}
.logo {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: #000;
  border: 1px solid #2a2a2a;
  object-fit: cover;
}
.brand { display: flex; flex-direction: column; }
.brand strong { font-size: 16px; letter-spacing: 0.18em; font-weight: 700; }
.brand span { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.header-meta { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; }

main {
  flex: 1;
  overflow: auto;
  padding: 12px 14px 18px;
  padding-bottom: calc(86px + var(--safe));
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; align-items: center; gap: 8px; }
.space { justify-content: space-between; }

h2.sec {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin: 16px 2px 8px;
}
h2.sec:first-child { margin-top: 4px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 1px solid #2a2a2a;
  background: #0e0e0e;
  color: #cfcfcf;
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 11px;
  letter-spacing: 0.04em;
}
.chip.on { background: #fff; color: #000; border-color: #fff; font-weight: 600; }

.match {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 8px;
}
.match.live {
  padding: 16px 14px;
  background: linear-gradient(180deg, #141414 0%, #0d0d0d 100%);
  border-color: #2a1518;
  box-shadow: inset 0 0 0 1px rgba(225,29,46,0.18);
}
.match.finished { opacity: 0.92; }
.league-tag { font-size: 10px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
.live-pill {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--live); font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--live);
  box-shadow: 0 0 0 0 rgba(225,29,46,.7);
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(225,29,46,.55); }
  70% { box-shadow: 0 0 0 8px rgba(225,29,46,0); }
  100% { box-shadow: 0 0 0 0 rgba(225,29,46,0); }
}
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 8px; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.team.away { justify-content: flex-end; text-align: right; }
.crest { width: 26px; height: 26px; object-fit: contain; }
.match.live .crest { width: 34px; height: 34px; }
.tname { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match.live .tname { font-size: 15px; }
.score {
  font-variant-numeric: tabular-nums;
  font-weight: 750;
  font-size: 22px;
  letter-spacing: 0.04em;
  min-width: 64px;
  text-align: center;
}
.match.live .score { font-size: 32px; min-width: 84px; }
.clock { text-align: center; font-size: 11px; color: var(--muted); margin-top: 2px; }
.match.live .clock { color: var(--live); font-weight: 700; font-size: 12px; }
.events { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.ev {
  font-size: 12px; color: #c8c8c8;
  display: flex; gap: 8px; align-items: baseline;
}
.ev b { color: #fff; font-weight: 600; }
.ev .min { color: var(--dim); width: 34px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; padding: 28px 8px; text-align: center; }

.search {
  width: 100%;
  background: #0e0e0e;
  border: 1px solid #262626;
  color: #fff;
  border-radius: 12px;
  padding: 11px 12px;
  font-size: 14px;
  outline: none;
}
.search:focus { border-color: #444; }
.player {

}
.ava {

  background: #1a1a1a; object-fit: cover; border: 1px solid #2a2a2a;
}
.pname { font-size: 14px; font-weight: 600; }
.pmeta { font-size: 11px; color: var(--muted); }
.icon-btn, .btn {
  border: 0; cursor: pointer; font-family: inherit;
}
.btn {
  background: #fff; color: #000; border-radius: 10px;
  padding: 10px 14px; font-weight: 650; font-size: 13px;
}
.btn.ghost { background: transparent; color: #ddd; border: 1px solid #2a2a2a; }
.btn.red { background: #1a0d0f; color: #f0c9cd; border: 1px solid #3a1c20; }
.btn.ok { background: #0f1a14; color: #b7ebc9; border: 1px solid #1d3a28; }
.btn.warn { background: #1a170c; color: #ead9a0; border: 1px solid #3a3418; }
.btn.full { width: 100%; }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.add {
  margin-left: auto;
  width: 32px; height: 32px; border-radius: 50%;
  background: #fff; color: #000; border: 0; font-size: 20px; line-height: 1; cursor: pointer;
}
.add.on { background: #1a1a1a; color: #fff; border: 1px solid #333; }
.add.minus { background: #1a1a1a; color: #eee; border: 1px solid #333; font-size: 22px; }
.trash {
  margin-left: auto;
  width: 32px; height: 32px; border-radius: 50%;
  background: transparent; color: #c8c8c8;
  border: 1px solid #2a2a2a; font-size: 15px; line-height: 1;
  cursor: pointer; padding: 0;
}
.trash:active { color: #fff; border-color: #555; }
.rank {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 10px; align-items: center;
  padding: 10px 2px; border-bottom: 1px solid #161616;
}
.rank .pname, .rank .pmeta {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pos { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ga { text-align: right; }
.ga b { font-size: 16px; color: #ffb020; }
.ga span { display: block; font-size: 10px; color: var(--muted); }

.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
}
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px;
}
.stat .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
.stat.pos .n { color: var(--ok); }
.stat.neg .n { color: var(--bad); }

.form { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; }
label.field { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
select, input[type="number"], input[type="text"] {
  width: 100%; background: #0e0e0e; border: 1px solid #262626; color: #fff;
  border-radius: 12px; padding: 11px 12px; font-size: 14px; outline: none;
}
.seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

  background: #0e0e0e; color: #bbb; border: 1px solid #262626;
  border-radius: 10px; padding: 10px 6px; font-size: 12px; cursor: pointer;
}
.seg button.on { background: #fff; color: #000; border-color: #fff; font-weight: 650; }

.bet {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; margin-bottom: 8px;
}
.bet-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.status {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 999px; border: 1px solid #333; color: var(--muted);
}
.status.open { color: #ddd; }
.status.won { color: var(--ok); border-color: #1d3a28; }
.status.lost { color: var(--bad); border-color: #3a1c20; }
.status.cancelled, .status.refunded { color: var(--warn); border-color: #3a3418; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.decisif { margin-top: 6px; font-size: 12px; color: #cfcfcf; }
.decisif li { margin: 4px 0; }

nav.tabs {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: #000;
  border-top: 1px solid #1c1c1c;
  padding: 8px 6px calc(10px + var(--safe));
}
nav.tabs button {
  background: none; border: 0; color: #666; font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; font-weight: 600;
}
nav.tabs button svg { width: 20px; height: 20px; }
nav.tabs button.on { color: #fff; }
.lg-ico { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; }
.chip .lg-ico { width: 18px; height: 18px; vertical-align: -4px; }
.league-tag { letter-spacing: 0; }


article.match { cursor: pointer; }
.back {
  border: 1px solid #2a2a2a; background: #0e0e0e; color: #fff;
  border-radius: 999px; padding: 6px 12px; font-size: 12px; margin-bottom: 10px; cursor: pointer;
}
.stat-table { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.stat-row {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 8px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #1a1a1a;
  font-size: 13px;
}
.stat-row:last-child { border-bottom: 0; }
.stat-row span { color: var(--muted); text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.stat-row b:first-child { text-align: left; }
.stat-row b:last-child { text-align: right; }
.xi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.xi-col { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.xi-p { display: flex; gap: 8px; font-size: 12px; margin-top: 4px; }
.xi-p.fav-hit b { color: #ffb020; font-weight: 700; }
.xi-p .min { width: 20px; color: var(--dim); }


.date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.date-nav button {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid #2a2a2a;
  background: #0e0e0e; color: #fff; cursor: pointer;
}
.date-label { font-size: 13px; font-weight: 600; }

.toast {
  position: absolute; left: 16px; right: 16px; bottom: calc(78px + var(--safe));
  background: #fff; color: #000; border-radius: 10px; padding: 10px 12px;
  font-size: 13px; font-weight: 600; display: none; text-align: center;
}
.modal-bg {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.72);
  display: flex; align-items: center; justify-content: center;
  z-index: 40; padding: 20px;
}
.modal-bg[hidden] { display: none; }
.modal {
  width: 100%; max-width: 320px;
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  padding: 18px 16px 14px;
}
.modal-txt {
  margin: 0 0 16px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  color: #f4f4f4;
}
.modal-actions { display: flex; gap: 8px; }
.modal-actions .btn { flex: 1; }
.btn {
  border: 0; border-radius: 10px; padding: 10px 12px;
  font-size: 14px; font-weight: 650; cursor: pointer;
  background: #fff; color: #000;
}
.btn.ghost {
  background: #1a1a1a; color: #eee; border: 1px solid #2a2a2a;
}
.tk-ok { position:absolute; top:10px; right:42px; font-size:14px; }
.vol-row { display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12px; color:var(--muted); }
.vol-row input { flex:1; accent-color:#ffb020; }
.vol-row b { color:#fff; width:28px; text-align:right; }
.lg-fold {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  background: transparent; border: 0; color: #eee; font-size: 13px; padding: 0; cursor: pointer;
}
.lg-fold span:last-child { color: var(--muted); font-size: 12px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.backup-box {
  width: 100%; margin-top: 10px; box-sizing: border-box;
  background: #0a0a0a; color: #ddd; border: 1px solid #2a2a2a;
  border-radius: 10px; padding: 10px; font-size: 11px;
  font-family: ui-monospace, monospace; min-height: 88px;
}
.loading { color: var(--muted); font-size: 12px; text-align: center; padding: 16px; }

.fav-hit {
  color: #ffb020;
  font-weight: 700;
}
.ev .assist { color: #c8c8c8; font-weight: 500; }
.ev .assist .fav-hit { color: #ffb020; }

.match { position: relative; overflow: hidden; }
.star {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.85;

  padding: 0;

}
.star.on { color: #ffd000; opacity: 1; text-shadow: 0 0 8px rgba(255,208,0,.45); }
.st-ht, .st-fin {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
}
.st-ht { color: #ffb020; }
.st-fin { color: #9a9a9a; }
.match.ht .clock { color: #ffb020; font-weight: 700; }
.match.finished .clock { color: #9a9a9a; font-weight: 700; }
.match.goal-flash > *:not(.buuut) { opacity: 0.1; }
.match.goal-flash .buuut.fav { color: #ffb020; }
.buuut.name { font-size: 28px; letter-spacing: 0.04em; text-align: center; padding: 0 12px; }
.buuut { opacity: 1; }
.buuut.fav { color: #ffb020; }
.buuut.name { font-size: 28px; letter-spacing: 0.04em; text-align: center; padding: 0 12px; }

  color: #fff;

}

  50%, 100% { opacity: 0; }
}

.chips.wrap { flex-wrap: wrap; }

.toggle {

}

  background: #ffd000;
  border-color: #ffd000;
  color: #111;
}

.events.split {

}
.evcol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.ev.home, .ev.away { width: 100%; }

    const side = (c) => ({

      name: (c.team || {}).displayName || (c.team || {}).name || "?",
      full: (c.team || {}).displayName || "",
      score: c.score != null && c.score !== "" ? c.score : (isLive || isDone ? 0 : ""),
      logo: (c.team || {}).logo || "",
      record: ((c.records || []).find((r) => r.type === "ytd") || c.records?.[0] || {}).summary || "",
      form: ""
    });
    let clockTxt = kickoff(event.date);
    if (isDone) {
      clockTxt = /SO|shootout/i.test(statusBlob) ? "FIN/TB" : /OT|overtime/i.test(statusBlob) ? "FIN/Prol." : "FIN";
    } else if (isBreak) {
      clockTxt = "ENT";
    } else if (isLive) {
      const per = periodLabel(period, statusBlob);
      clockTxt = [clock && clock !== "0:00" ? clock : "", per].filter(Boolean).join(" ") || status.shortDetail || "LIVE";
    }
    return {
      id: event.id,
      leagueId: "nhl",
      league: "NHL",
      date: event.date,
      isLive,
      isHT: isBreak,
      isDone,
      clock: clockTxt,
      period,
      statusBlob,
      home: side(home),
      away: side(away),
      scorers: []
    };
  }

  function goalKind(play) {
    const text = play.text || "";
    const str = ((play.strength || {}).abbreviation || "") + " " + ((play.strength || {}).text || "");
    const per = (play.period || {}).number || 0;
    if (per >= 5 || /shootout/i.test(text)) return "so";
    if (/empty net/i.test(text)) return "en";
    if (/penalty shot/i.test(text)) return "ps";
    if (/short/i.test(str)) return "sh";
    if (/power/i.test(str)) return "pp";
    return "but";
  }
  function applyPlays(m, plays) {
    const goals = (plays || []).filter((p) => p.scoringPlay && /goal/i.test((p.type || {}).text || p.text || ""));
    if (!goals.length) return;
    m.scorers = goals.map((p) => {
      const parts = p.participants || [];
      const scorer = parts.find((x) => x.type === "scorer") || parts[0] || {};
      const assists = parts.filter((x) => x.type === "assister");
      const per = (p.period || {}).number || 0;
      const clk = (p.clock || {}).displayValue || "";
      return {
        minute: [clk, periodLabel(per, "")].filter(Boolean).join(" "),
        period: per,
        kind: goalKind(p),
        scorer: (scorer.athlete || {}).displayName || "?",
        scorerId: String((scorer.athlete || {}).id || ""),
        assist: (assists[0] && assists[0].athlete && assists[0].athlete.displayName) || "",
        assistId: assists[0] ? String(assists[0].athlete.id || "") : "",
        assist2: (assists[1] && assists[1].athlete && assists[1].athlete.displayName) || "",
        assist2Id: assists[1] ? String(assists[1].athlete.id || "") : "",
        teamId: String((p.team || {}).id || ""),
      };
    });
  }
  async function enrichScoring(matches) {
    const need = matches.filter((m) => m.isLive || m.isDone);
    await Promise.allSettled(need.map(async (m) => {
      try {
        const d = await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=" + m.id);
        applyPlays(m, d.plays || []);
        const teams = ((d.boxscore || {}).teams) || [];
        const statMap = {};
        teams.forEach((t) => {
          const id = String((t.team || {}).id || "");
          const bag = {};
          (t.statistics || []).forEach((s) => { bag[s.name] = s.displayValue; });
          statMap[id] = bag;
        });
        m._teamStats = statMap;
      } catch (e) {}
    }));
  }
  function dressed(side) {
    const players = [];
    ((side && side.statistics) || []).forEach((block) => {
      const role = block.name || "";
      if (role === "skaters") return;
      (block.athletes || []).forEach((row) => {
        const a = row.athlete || {};
        if (a.scratched) return;
        players.push({
          id: String(a.id || ""),
          name: a.displayName || "",
          jersey: a.jersey || "",
          starter: true,
          pos: (a.position || {}).abbreviation || role
        });
      });
    });
    return players;
  }
  async function enrichLineups(matches) {
    const need = matches.filter((m) => !m.isDone).slice(0, 16);
    await Promise.allSettled(need.map(async (m) => {
      try {
        const d = await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=" + m.id);
        const starters = [];
        (((d.boxscore || {}).players) || []).forEach((side) => {
          dressed(side).forEach((p) => starters.push(p));
        });
        if (starters.length) {
          m.starters = starters;
          state.lineups[m.id] = starters;
        }
      } catch (e) {}
    }));
  }
  function starterNote(m) {
    if (m.isLive || m.isDone || m.isHT) return "";
    if (!m.starters || !m.starters.length) return "";
    const mine = favs();
    const hits = [];
    const seen = new Set();
    m.starters.forEach((s) => {
      const hit = mine.find((p) => String(p.id) === String(s.id) || (p.name && s.name && fold(p.name) === fold(s.name)));
      if (hit && !seen.has(String(hit.id))) { seen.add(String(hit.id)); hits.push(hit.name); }
    });
    if (!hits.length) return "";
    if (hits.length === 1) return hits[0] + " est dans la formation";
    if (hits.length === 2) return hits[0] + " et " + hits[1] + " sont dans la formation";
    return hits.slice(0, -1).join(", ") + " et " + hits[hits.length - 1] + " sont dans la formation";
  }
  function keepScroll(fn) {
    const y = main.scrollTop;
    fn();
    main.scrollTop = y;
  }
  function gameVisible(m) {
    const pool = activeLeagues().map((l) => l.id);
    const dh = divOf(m.home.name);
    const da = divOf(m.away.name);
    if (dh && da && !pool.includes(dh) && !pool.includes(da)) return false;
    if (state.league === "all") return true;
    return dh === state.league || da === state.league;
  }
  async function loadMatches(opts = {}) {
    const silent = !!opts.silent;
    if (!silent) { state.loading = true; render(); }
    const date = ymd(state.date);
    let matches = [];
    try {
      const d = await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=" + date + "&limit=80");
      matches = (d.events || []).map(parseMatch);
    } catch (e) { matches = []; }
    matches = matches.filter(gameVisible);
    await enrichScoring(matches);
    await enrichLineups(matches);
    state.matches = matches.sort((a, b) => new Date(a.date) - new Date(b.date));
    state.loading = false;
    try { detectGoals(state.matches); } catch (e) {}
    try { settleTickets(state.matches); } catch (e) {}
    if (state.tab === "matches" || state.tab === "bets" || !silent) render();
  }
  async function loadMatchDetail(m) {
    state.detail[m.id] = { loading: true };
    render();
    const info = { loading: false };
    try {
      const d = await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=" + m.id);
      applyPlays(m, d.plays || []);
      const teams = ((d.boxscore || {}).teams) || [];
      teams.forEach((t) => {
        const bag = {};
        (t.statistics || []).forEach((s) => { bag[s.name] = s.displayValue; });
        const block = {
          shots: bag.shotsTotal || "—",
          hits: bag.hits || "—",
          blocked: bag.blockedShots || "—",
          pp: (bag.powerPlayGoals || "0") + "/" + (bag.powerPlayOpportunities || "0"),
        };
        if (t.homeAway === "home") info.home = block;
        else info.away = block;
      });
      (((d.boxscore || {}).players) || []).forEach((side) => {
        const block = { name: (side.team || {}).shortDisplayName || (side.team || {}).displayName || "", formation: "", players: dressed(side) };
        if (String((side.team || {}).id) === String(m.home.id)) info.homeXi = block;

  function isFavPlayer(id, name) {
    const list = favs();
    const sid = String(id || "");
    const n = fold(name);
    if ((state.demoFavNames || []).some((x) => n && fold(x) === n)) return true;
    return list.some((p) => {
      if (sid && String(p.id) === sid) return true;
      const pn = fold(p.name);
      return n && pn && (pn === n || pn.includes(n) || n.includes(pn));
    });
  }
  function markFav(name, id) {
    const safe = String(name || "").replace(/</g, "");
    if (!safe) return "";
    return isFavPlayer(id, safe) ? `<span class="fav-hit">${safe}</span>` : safe;
  }
  function kindTag(s) {
    if (s.kind === "pp") return ` <span class="kind-tag">SN</span>`;
    if (s.kind === "sh") return ` <span class="kind-tag">IN</span>`;
    if (s.kind === "en") return ` <span class="kind-tag">CF</span>`;
    if (s.kind === "ps") return ` <span class="kind-tag">TP</span>`;
    if (s.kind === "so") return ` <span class="kind-tag">TB</span>`;
    return "";
  }
  function scorerLine(s, side) {
    const scorer = markFav(s.scorer, s.scorerId);
    const assists = [s.assist, s.assist2].filter(Boolean);
    const assist = assists.length
      ? ` <span class="assist">(${[markFav(s.assist, s.assistId), s.assist2 ? markFav(s.assist2, s.assist2Id) : ""].filter(Boolean).join(", ")})</span>`
      : "";
    const min = `<span class="min">${s.minute}</span>`;
    const name = `<span class="evname"><b>${scorer}</b>${kindTag(s)}${assist}</span>`;
    return side === "away"
      ? `<div class="ev away">${name}${min}</div>`
      : `<div class="ev home">${min}${name}</div>`;
  }
  function scorerSide(m, s) {
    const tid = String(s.teamId || "");
    if (tid && m.home.id && tid === String(m.home.id)) return "home";
    if (tid && m.away.id && tid === String(m.away.id)) return "away";
    return "home";
  }
  function statusBadge(m) {
    if (m.isDone) return `<span class="st-fin">${m.clock || "FIN"}</span>`;
    if (m.isHT) return `<span class="st-ht">ENT</span>`;
    if (m.isLive) return `<span class="live-pill"><span class="dot"></span>${m.clock || "LIVE"}</span>`;
    return `<span class="league-tag">${m.clock}</span>`;
  }
  function matchFavs() { return loadJson(LS_MATCH_FAV, []); }
  function isMatchFav(id) { return matchFavs().includes(String(id)); }
  function toggleMatchFav(id) {
    id = String(id);
    let list = matchFavs();
    if (list.includes(id)) list = list.filter((x) => x !== id);
    else list.unshift(id);
    saveJson(LS_MATCH_FAV, list);
    keepScroll(() => render());
  }
  function tickets() { return loadJson(LS_TICKETS, []); }
  function saveTickets(list) { saveJson(LS_TICKETS, list); }
  function ticketsFor(mid) { return tickets().filter((x) => String(x.matchId) === String(mid)); }
  function ticketWonOn(mid) { return ticketsFor(mid).some((x) => x.status === "won"); }

  function matchCard(m) {
    const homeEv = (m.scorers || []).filter((s) => scorerSide(m, s) === "home").map((s) => scorerLine(s, "home")).join("");
    const awayEv = (m.scorers || []).filter((s) => scorerSide(m, s) === "away").map((s) => scorerLine(s, "away")).join("");
    const events = (homeEv || awayEv)
      ? `<div class="events split"><div class="evcol">${homeEv}</div><div class="evcol away">${awayEv}</div></div>`
      : (m.isLive ? `<div class="events"><div class="ev">Pas encore de but</div></div>` : "");
    const left = (state.goalUntil[m.id] || 0) - Date.now();
    const flashing = left > 0;
    const showName = flashing && getSettings().buuutShowScorer && left <= 2500;
    const buuutTxt = showName ? (state.goalScorer[m.id] || "BUUUT!") : "BUUUT!";
    const buuutOrange = flashing && getSettings().buuutOrangeFav && state.goalFavHit[m.id];
    const favOn = isMatchFav(m.id);
    return `
      <article class="match ${m.isLive ? "live" : ""} ${m.isDone ? "finished" : ""} ${m.isHT ? "ht" : ""} ${flashing ? "goal-flash" : ""}" data-mid="${m.id}">
        ${flashing ? `<div class="buuut ${buuutOrange ? "fav" : ""} ${showName ? "name" : ""}">${buuutTxt}</div>` : ""}
        <button class="star ${favOn ? "on" : ""}" data-star="${m.id}" aria-label="Favori">${favOn ? "★" : "☆"}</button>
        ${ticketWonOn(m.id) ? `<span class="tk-ok">✅</span>` : ""}
        <div class="row space match-head"><span class="league-tag">${matchLeagueLabel(m)}</span></div>
        <div class="scoreboard">
          <div class="team">
            ${m.home.logo ? `<img class="crest" src="${m.home.logo}" alt="">` : ""}
            <span class="tname">${m.home.name}</span>
          </div>
          <div>
            <div class="score">${m.isDone || m.isLive ? `${m.home.score}–${m.away.score}` : "–"}</div>
            <div class="clock">${statusBadge(m)}</div>
          </div>
          <div class="team away">
            <span class="tname">${m.away.name}</span>
            ${m.away.logo ? `<img class="crest" src="${m.away.logo}" alt="">` : ""}
          </div>
        </div>
        ${starterNote(m) ? `<div class="xi">${starterNote(m)}</div>` : ""}
        ${events}
      </article>`;
  }
  function lineupCol(side) {
    if (!side) return `<div class="pmeta">Formation pas encore publiée</div>`;
    const xi = side.players || [];
    const row = (p) => {
      const mine = (p.id && isFav(p.id)) || favs().some((f) => f.name && p.name && fold(f.name) === fold(p.name));
      return `<div class="xi-p${mine ? " fav-hit" : ""}"><span class="min">${p.jersey || ""}</span><b>${p.name}</b></div>`;

  function renderMatchDetail(m) {

      <h2 class="sec">Paris</h2>
      ${ticketsFor(m.id).length ? ticketsFor(m.id).map((tk) => `
        <div class="player"><div style="min-width:0;flex:1"><div class="pname">${ticketMark(tk)} ${marketLabel(tk.market || tk.pick)}${tk.playerName ? " · "+tk.playerName : ""}${tk.playerName2 ? " / "+tk.playerName2 : ""}</div></div>
        <button class="trash" data-tkdel="${tk.id}">🗑</button></div>`).join("") : `<div class="pmeta">Aucun pari sur ce match.</div>`}

  function renderMatches() {

    const live = state.matches.filter((m) => m.isLive && !fav(m));

  function isFav(id) { return favs().some((p) => String(p.id) === String(id)); }
  function catalogSearch(q) {
    const s = fold(q.trim());
    if (!s) return [];
    return CATALOG.filter((p) => fold(`${p.name} ${p.team}`).includes(s));
  }
  function clubLine(p) {
    const team = p.team || "";
    const div = divName(divOf(team));
    return [team, div || "NHL"].filter(Boolean).join(" · ");
  }
  function teamMatchesPlayer(p, team) {
    const a = fold(p.team || "");
    const names = [team && team.name, team && team.full].map((x) => fold(x)).filter(Boolean);
    return a && names.some((n) => n === a || n.includes(a) || a.includes(n));
  }
  function playsToday(p) {
    return (state.matches || []).some((m) => teamMatchesPlayer(p, m.home) || teamMatchesPlayer(p, m.away));
  }
  function playerRow(p, isMine, suggest) {
    const today = isMine && playsToday(p);

  function hotSuggestHtml() {
    const mine = new Set(favs().map((p) => String(p.id)));
    const hidden = new Set((loadJson(LS_HIDE_SUG, []) || []).map(String));
    const list = (state.hotPlayers || []).filter((p) => !mine.has(String(p.id)) && !hidden.has(String(p.id))).slice(0, 5);
    if (!list.length) return "";

  async function loadHotPlayers() {
    if (state.hotPlayers && state.hotPlayers.length) return;
    try {
      const d = await fetchJSON("https://site.web.api.espn.com/apis/site/v2/sports/hockey/nhl/statistics");
      const cats = ((d.stats || {}).categories) || [];
      const bag = {};
      cats.forEach((cat) => {
        const kind = /assist/i.test(cat.name || "") ? "a" : cat.name === "goals" ? "g" : cat.name === "points" ? "p" : "";
        if (!kind) return;
        (cat.leaders || []).slice(0, 25).forEach((row) => {
          const ath = row.athlete || {};
          const id = String(ath.id || "");
          if (!id) return;
          const cur = bag[id] || { id, name: ath.displayName || "", team: (ath.team && ath.team.displayName) || "", league: "NHL", pos: "", g: 0, a: 0, pts: 0 };
          const v = Number(row.value) || 0;
          if (kind === "g") cur.g = Math.max(cur.g, v);
          if (kind === "a") cur.a = Math.max(cur.a, v);
          if (kind === "p") cur.pts = Math.max(cur.pts, v);
          bag[id] = cur;
        });
      });
      state.hotPlayers = Object.values(bag).map((p) => {
        p.ga = p.pts || ((p.g || 0) + (p.a || 0));
        p.league = (p.ga ? (p.ga + " PTS · ") : "") + (p.team || "NHL");
        p.team = p.team || "";
        return p;
      }).filter((p) => p.ga > 0).sort((a, b) => b.ga - a.ga);
    } catch (e) { state.hotPlayers = []; }
    if (state.tab === "favs" && !state.q) render();
  }
  function renderFavs() {
    const q = state.q.trim();
    const local = catalogSearch(q);
    const remote = [...local, ...state.searchRemote].filter((p, i, arr) => {
      if (favs().some((x) => String(x.id) === String(p.id))) return false;
      return arr.findIndex((x) => String(x.id) === String(p.id) || fold(x.name) === fold(p.name)) === i;
    });
    const mine = favs().slice().sort((a, b) => {
      const da = playsToday(a) ? 0 : 1;
      const db = playsToday(b) ? 0 : 1;
      if (da !== db) return da - db;
      return String(a.name).localeCompare(String(b.name));
    });
    const results = q.length >= 2 ? remote : [];
    return `

  function playerHit(m, pid, name, goal, assist) {

  function evalTicket(tk, m) {
    if (!m) return "open";
    const mk = tk.market || tk.pick || "";
    const hs = Number(m.home.score) || 0;
    const as = Number(m.away.score) || 0;
    const tot = hs + as;
    const done = !!m.isDone;
    const win = (ok) => ok ? "won" : (done ? "lost" : "open");
    if (mk === "1") return win(done && hs > as);
    if (mk === "N") return win(done && hs === as);
    if (mk === "2") return win(done && as > hs);
    if (mk === "1N") return win(done && hs >= as);
    if (mk === "N2") return win(done && as >= hs);
    if (mk === "over55") return tot >= 6 ? "won" : (done ? "lost" : "open");
    if (mk === "over65") return tot >= 7 ? "won" : (done ? "lost" : "open");
    if (mk === "buteur") return win(playerHit(m, tk.playerId, tk.playerName, true, false));
    if (mk === "passeur") return win(playerHit(m, tk.playerId, tk.playerName, false, true));
    if (mk === "decisif") return win(playerHit(m, tk.playerId, tk.playerName, true, true));
    if (mk === "dc_buteur") {
      const a = playerHit(m, tk.playerId, tk.playerName, true, false);
      const b = playerHit(m, tk.playerId2, tk.playerName2, true, false);
      return win(a || b);
    }
    return tk.status || "open";
  }

  function playGoalSound() {
    if (!getSettings().soundGoals) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!playGoalSound.ctx) playGoalSound.ctx = new Ctx();
      const ctx = playGoalSound.ctx;
      if (ctx.state === "suspended") ctx.resume();
      const vol = Math.max(0, Math.min(1, (Number(getSettings().soundVol) || 70) / 100)) * 0.22;
      const t0 = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.value = vol;
      master.connect(ctx.destination);
      const note = (freq, start, dur, type, gain) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type || "sawtooth";
        o.frequency.setValueAtTime(freq, t0 + start);
        g.gain.setValueAtTime(0.0001, t0 + start);
        g.gain.exponentialRampToValueAtTime(gain || 1, t0 + start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        o.connect(g); g.connect(master);
        o.start(t0 + start);
        o.stop(t0 + start + dur + 0.02);
      };
      note(392, 0.00, 0.11, "sawtooth", 0.9);
      note(494, 0.11, 0.11, "sawtooth", 1.0);
      note(587, 0.22, 0.13, "sawtooth", 1.1);
      note(784, 0.35, 0.55, "sawtooth", 1.2);
      note(784, 0.35, 0.55, "square", 0.25);
    } catch (e) {}
  }
  function detectGoals(matches) {
    const now = Date.now();
    let flash = false;
    matches.forEach((m) => {
      const key = String(m.home.score) + "-" + String(m.away.score);
      const prev = state.scoreSnap[m.id];
      state.scoreSnap[m.id] = key;
      if (prev == null || prev === key) return;
      const [ph, pa] = prev.split("-").map((n) => Number(n) || 0);
      const nh = Number(m.home.score) || 0;
      const na = Number(m.away.score) || 0;
      if (nh + na > ph + pa) {
        state.goalUntil[m.id] = now + 5000;
        const last = (m.scorers || [])[(m.scorers || []).length - 1];
        state.goalScorer[m.id] = last ? (last.scorer || "") : "";
        state.goalFavHit[m.id] = !!(last && isFavPlayer(last.scorerId, last.scorer));
        flash = true;
        if (getSettings().vibrateGoals && isMatchFav(m.id) && navigator.vibrate) navigator.vibrate([35, 40, 35]);
        if (isMatchFav(m.id)) playGoalSound();
        try { notifyFavDecisive(m); } catch (e) {}
      }
    });
    if (flash) {
      clearTimeout(detectGoals._t);
      clearTimeout(detectGoals._t2);
      detectGoals._t = setTimeout(() => { if (state.tab === "matches") keepScroll(() => render()); }, 5200);
      if (getSettings().buuutShowScorer) {

      }
    }
  }

          <button class="btn sm ghost" id="btnCopyBackup">Copier</button>
          <button class="btn sm ghost" id="btnImportFile">Fichier…</button>
        </div>
        <textarea id="backupBox" class="backup-box" rows="4" placeholder="Colle ici un export Cracks"></textarea>
        <button class="btn" id="btnImportText" style="width:100%;margin-top:8px">Importer</button>
        <input id="backupFile" type="file" accept="application/json,.json,.txt" hidden/>
      </article>`;
  }

  function render() {
    if (state.tab === "matches") main.innerHTML = renderMatches();
    else if (state.tab === "favs") main.innerHTML = renderFavs();
    else if (state.tab === "bets") main.innerHTML = renderParis();
    else if (state.tab === "rank") main.innerHTML = renderRank();
    else main.innerHTML = renderSettings();
    bind();
  }
  function bind() {
    $("#dPrev")?.addEventListener("click", () => { state.date = new Date(state.date.getTime() - 86400000); loadMatches(); });
    $("#dNext")?.addEventListener("click", () => { state.date = new Date(state.date.getTime() + 86400000); loadMatches(); });
    $("#leagueChips")?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-lg]");
      if (!btn) return;
      state.league = btn.dataset.lg;
      loadMatches();
    });
    main.querySelectorAll("[data-star]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleMatchFav(btn.dataset.star); });
    });
    document.getElementById("backMatches")?.addEventListener("click", () => { state.detailId = null; render(); });
    if (!state.detailId) {
      main.querySelectorAll("article.match").forEach((el) => {
        el.addEventListener("click", () => {
          state.detailId = el.dataset.mid;
          render();
          const m = state.matches.find((x) => String(x.id) === String(state.detailId));
          if (m) loadMatchDetail(m);
        });
      });
    }
    const search = $("#playerSearch");
    if (search) {
      search.addEventListener("input", (e) => {
        state.q = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const again = document.getElementById("playerSearch");
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
        clearTimeout(bind._t);
        bind._t = setTimeout(() => remoteSearch(state.q), 280);
      });
    }
    main.querySelectorAll("[data-hide]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = String(btn.dataset.hide);
        const list = loadJson(LS_HIDE_SUG, []);
        if (!list.map(String).includes(id)) list.push(id);
        saveJson(LS_HIDE_SUG, list);
        render();
      });
    });
    main.querySelectorAll("[data-add]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.add;
        const p = [...CATALOG, ...state.searchRemote, ...(state.hotPlayers || []), ...favs()].find((x) => String(x.id) === id);
        if (p) addFav(p);
      });
    });
    main.querySelectorAll("[data-rm]").forEach((btn) => btn.addEventListener("click", () => removeFav(btn.dataset.rm)));
    document.getElementById("rankSort")?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-rsort]");
      if (!btn) return;
      state.rankSort = btn.dataset.rsort;
      render();
    });
    document.querySelectorAll("[data-tkpick]").forEach((b) => b.addEventListener("click", () => { state.betMarket = b.dataset.tkpick; render(); }));
    document.getElementById("tkMatch")?.addEventListener("change", (e) => { state.betMatch = e.target.value; });
    document.getElementById("tkAdd")?.addEventListener("click", () => {
      const mid = document.getElementById("tkMatch")?.value;
      const mk = state.betMarket || "1";
      if (!mid) { toast("Choisis un match"); return; }
      const needP = ["buteur","passeur","decisif","dc_buteur"].includes(mk);
      const pid = document.getElementById("tkPlayer")?.value || "";
      const pid2 = document.getElementById("tkPlayer2")?.value || "";
      if (needP && !pid) { toast("Choisis un joueur"); return; }
      if (mk === "dc_buteur" && !pid2) { toast("Choisis le 2e joueur"); return; }
      const m = state.matches.find((x) => String(x.id)===String(mid));
      const p1 = favs().find((x) => String(x.id)===String(pid));
      const p2 = favs().find((x) => String(x.id)===String(pid2));
      const list = tickets();
      list.push({
        id: Date.now().toString(36), matchId: mid,
        matchName: m ? (m.home.name + " – " + m.away.name) : "",
        market: mk, pick: mk, playerId: pid, playerId2: pid2,
        playerName: p1 ? p1.name : "", playerName2: p2 ? p2.name : "",
        label: marketLabel(mk), status: "open",
      });
      saveTickets(list);
      settleTickets(state.matches);
      toast("Pari ajouté");
      render();
    });
    main.querySelectorAll("[data-tkdel]").forEach((b) => b.addEventListener("click", (e) => {
      e.stopPropagation();
      saveTickets(tickets().filter((x) => String(x.id) !== String(b.dataset.tkdel)));
      render();
    }));
    document.getElementById("togVibrate")?.addEventListener("click", () => {
      const next = !getSettings().vibrateGoals;
      setSetting("vibrateGoals", next);
      if (next && navigator.vibrate) navigator.vibrate(25);
      render();
    });
    document.getElementById("togBuuutOrange")?.addEventListener("click", () => { setSetting("buuutOrangeFav", !getSettings().buuutOrangeFav); render(); });
    document.getElementById("togBuuutName")?.addEventListener("click", () => { setSetting("buuutShowScorer", !getSettings().buuutShowScorer); render(); });
    document.getElementById("btnTestMatch")?.addEventListener("click", () => launchTestMatch());
    document.getElementById("togSound")?.addEventListener("click", () => {
      const next = !getSettings().soundGoals;
      setSetting("soundGoals", next);
      if (next) playGoalSound();
      render();
    });
    document.getElementById("soundVol")?.addEventListener("input", (e) => {
      setSetting("soundVol", Number(e.target.value) || 70);
      const lab = e.target.parentElement.querySelector("b");
      if (lab) lab.textContent = String(e.target.value);
    });
    document.getElementById("soundVol")?.addEventListener("change", () => playGoalSound());
    document.getElementById("togFlags")?.addEventListener("click", () => { setSetting("flagsLeagues", !getSettings().flagsLeagues); render(); });
    document.getElementById("togNotifFav")?.addEventListener("click", async () => {
      const next = !getSettings().notifFavGoals;
      if (next) await enableFavNotifs();
      setSetting("notifFavGoals", next);
      render();
    });
    document.getElementById("lgFold")?.addEventListener("click", () => { state.lgOpen = !state.lgOpen; render(); });
    main.querySelectorAll("[data-lgvis]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.lgvis;
        const allIds = LEAGUES.map((l) => l.id);
        let cur = getSettings().enabledLeagues;
        if (!cur) cur = allIds.slice();
        cur = cur.filter((x) => allIds.includes(x));
        if (cur.includes(id)) cur = cur.filter((x) => x !== id);
        else cur.push(id);
        if (!cur.length) cur = allIds.slice();
        setSetting("enabledLeagues", cur);
        if (state.league !== "all" && !cur.includes(state.league)) state.league = "all";
        render();
      });
    });
    document.getElementById("btnExport")?.addEventListener("click", () => {
      const json = JSON.stringify(exportPayload());
      const box = document.getElementById("backupBox");
      if (box) box.value = json;
      try {
        const blob = new Blob([json], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "cracks-sauvegarde.json";
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {}
      toast("Export prêt");
    });
    document.getElementById("btnCopyBackup")?.addEventListener("click", async () => {
      const json = JSON.stringify(exportPayload());
      const box = document.getElementById("backupBox");
      if (box) box.value = json;
      try { await navigator.clipboard.writeText(json); toast("Copié"); }
      catch { toast("Sélectionne le texte et copie"); }
    });
    document.getElementById("btnImportFile")?.addEventListener("click", () => document.getElementById("backupFile")?.click());
    document.getElementById("backupFile")?.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { applyBackup(JSON.parse(String(reader.result || ""))); toast("Import OK"); render(); }
        catch { toast("Fichier invalide"); }
      };
      reader.readAsText(file);
    });
    document.getElementById("btnImportText")?.addEventListener("click", () => {
      try { applyBackup(JSON.parse(document.getElementById("backupBox")?.value || "")); toast("Import OK"); render(); }
      catch { toast("Code invalide"); }
    });
  }

  document.querySelectorAll("nav.tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      state.detailId = null;
      document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b === btn));
      render();
      if (state.tab === "rank") refreshAllStats();
      if (state.tab === "matches") loadMatches();
      if (state.tab === "bets" && !state.matches.length) loadMatches({ silent: true });
      if (state.tab === "favs") {
        loadHotPlayers();
        if (!state.matches.length) loadMatches({ silent: true });
      }
    });
  });
  document.getElementById("confirmNo")?.addEventListener("click", hideConfirm);
  document.getElementById("confirmYes")?.addEventListener("click", confirmRemoveFav);
  document.getElementById("confirmBg")?.addEventListener("click", (e) => { if (e.target.id === "confirmBg") hideConfirm(); });

  setTimeout(() => { const sp = document.getElementById("splash"); if (sp) sp.classList.add("hide-title"); }, 1300);
  setTimeout(() => { const sp = document.getElementById("splash"); if (sp) sp.classList.add("through"); }, 2500);
  setTimeout(() => { const sp = document.getElementById("splash"); if (sp) sp.remove(); }, 2900);

  loadMatches();
  refreshAllStats();
  loadHotPlayers();
  setInterval(() => { if (state.tab === "matches") loadMatches({ silent: true }); }, 60000);
})();

</script>
</body>
</html>
